<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Velora</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f7ff, #fdf5fb);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(70, 50, 100, 0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, #704cff, #c44cff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            color: #292433;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .message {
            background: #fff0f0;
            color: #d33;
            padding: 11px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
            color: #514a5c;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e5dfeb;
            border-radius: 13px;
            outline: none;
            margin-bottom: 17px;
            background: #fcfbfe;
            font-size: 14px;
        }

        input:focus {
            border-color: #704cff;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 13px;
            background: linear-gradient(135deg, #704cff, #a855f7);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #888;
        }

        .bottom a {
            color: #704cff;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            V
        </div>

        <h1>Join Velora ✨</h1>

        <p class="subtitle">
            Create your account and start connecting.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
                autocomplete="username"
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
                autocomplete="new-password"
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="password2"
                placeholder="Enter password again"
                required
                autocomplete="new-password"
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="bottom">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</body>

</html>
